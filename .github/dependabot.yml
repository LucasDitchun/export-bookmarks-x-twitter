version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: typescript
        # typescript-eslint does not support the TypeScript 7 API yet.
        # https://github.com/typescript-eslint/typescript-eslint/issues/10940
        versions: [">=7"]
      - dependency-name: "@types/node"
        # Keep Node types aligned with the Node 24 runtime used locally and in CI.
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
