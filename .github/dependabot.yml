version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: typescript
        # typescript-eslint does not support the TypeScript 7 API yet.
        # https://github.com/typescript-eslint/typescript-eslint/issues/10940
        versions: [">=7"]
      - dependency-name: "@types/node"
        # Keep Node types aligned with the Node 24 runtime used locally and in CI.
        versions: [">=25"]
      - dependency-name: onnxruntime-web
        # Transformers 4.2 pins the compatible ORT prerelease; 1.27.x duplicates the WASM runtime.
        # The duplicate bundle adds one WASM file and cannot pass the real semantic browser gate.
        # https://github.com/LucasDitchun/export-bookmarks-x-twitter/pull/45
        versions: ["1.27.x"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
