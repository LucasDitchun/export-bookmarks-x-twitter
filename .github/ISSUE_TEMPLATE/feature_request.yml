name: Feature request
description: Suggest a focused improvement to Bookmark X.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the user problem first so the best solution can be evaluated.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request is related to capturing, organizing, or exporting X bookmarks.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What limitation or recurring task should this feature address?
      placeholder: When I…, I need…, because…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would find useful without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups or examples, but remove personal or sensitive bookmark data.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include private bookmark content, account details, or other sensitive data.
          required: true
