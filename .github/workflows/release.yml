name: Release

run-name: Release ${{ inputs.version || inputs.bump }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment used when no explicit version is provided
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit version in MAJOR.MINOR.PATCH format (for example, 1.2.3)
        required: false
        type: string

permissions: {}

concurrency:
  group: bookmark-x-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_BUMP: ${{ inputs.bump }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require the default branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$DISPATCH_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and synchronize version
        id: release
        run: |
          specification="${RELEASE_VERSION:-$RELEASE_BUMP}"
          version="$(node scripts/version.mjs "$specification")"
          archive="release/bookmark-x-$version.zip"

          pnpm exec prettier --write package.json public/manifest.json

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check release script syntax
        run: |
          node --check scripts/version.mjs
          node --check scripts/package.mjs
          node --check scripts/chrome-smoke.mjs

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build extension
        run: pnpm build

      - name: Validate and package extension
        run: pnpm package

      - name: Verify release archive
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          test -f "$RELEASE_ARCHIVE"
          test -f download/bookmark-x.zip
          cmp --silent "$RELEASE_ARCHIVE" download/bookmark-x.zip

      - name: Commit and tag release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            pnpm-lock.yaml \
            public/manifest.json \
            download/bookmark-x.zip
          git diff --cached --exit-code --quiet && {
            echo "::error::The version update did not produce a commit."
            exit 1
          }
          git commit -m "chore(release): $RELEASE_TAG"
          git tag --annotate "$RELEASE_TAG" --message "Bookmark X $RELEASE_TAG"

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git push --atomic origin \
            "HEAD:refs/heads/$DEFAULT_BRANCH" \
            "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ARCHIVE#Bookmark X $RELEASE_TAG" \
            --generate-notes \
            --title "Bookmark X $RELEASE_TAG" \
            --verify-tag
