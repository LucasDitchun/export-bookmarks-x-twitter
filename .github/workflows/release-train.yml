name: Stage candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: bookmark-x-stage-candidate
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the develop batch once
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source-sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the selected develop snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind the gate to the selected snapshot
        id: source
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EVENT_SHA"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch the public release baseline
        run: git fetch --force origin main --tags

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies once
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare the candidate version and changelog
        id: release
        run: |
          node .github/scripts/release-train.mjs prepare \
            --base-ref origin/main \
            --head-ref HEAD \
            --github-output "$GITHUB_OUTPUT"
          pnpm install --lockfile-only --offline
          pnpm exec prettier --write \
            package.json \
            pnpm-lock.yaml \
            public/manifest.json \
            CHANGELOG.md

      - name: Run the complete staging verification profile once
        run: pnpm verify:staging

      - name: Seal the tested ZIP and source identity
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          STAGED_ROOT: ${{ runner.temp }}/staged-candidate
        run: |
          mkdir -p "$STAGED_ROOT/download" "$STAGED_ROOT/public"
          cp package.json "$STAGED_ROOT/package.json"
          cp pnpm-lock.yaml "$STAGED_ROOT/pnpm-lock.yaml"
          cp CHANGELOG.md "$STAGED_ROOT/CHANGELOG.md"
          cp public/manifest.json "$STAGED_ROOT/public/manifest.json"
          cp download/bookmark-x.zip "$STAGED_ROOT/download/bookmark-x.zip"
          printf '%s\n' "$SOURCE_SHA" > "$STAGED_ROOT/SOURCE_SHA"
          (
            cd "$STAGED_ROOT"
            sha256sum \
              SOURCE_SHA \
              CHANGELOG.md \
              package.json \
              pnpm-lock.yaml \
              public/manifest.json \
              download/bookmark-x.zip > SHA256SUMS
          )

      - name: Verify the final staged release
        run: |
          node .github/scripts/release-train.mjs verify \
            --base-ref origin/main \
            --head-ref HEAD \
            --require-archive
          git diff --check

      - name: Upload the sealed staging candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-candidate-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/staged-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-staging:
    name: Publish only the verified snapshot
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the verified source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source-sha }}

      - name: Download the sealed staging candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-candidate-${{ needs.validate.outputs.source-sha }}
          path: ${{ runner.temp }}/staged-candidate

      - name: Verify and publish the staged snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
          STAGED_ROOT: ${{ runner.temp }}/staged-candidate
        run: |
          test "$SOURCE_SHA" = "$(cat "$STAGED_ROOT/SOURCE_SHA")"
          (
            cd "$STAGED_ROOT"
            sha256sum --check SHA256SUMS
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin develop staging || git fetch --force origin develop
          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            git switch --create staging --track origin/staging
            git merge --no-ff --no-commit "$SOURCE_SHA"
          else
            git switch --create staging "$SOURCE_SHA"
          fi

          mkdir -p download
          mkdir -p public
          cp "$STAGED_ROOT/package.json" package.json
          cp "$STAGED_ROOT/pnpm-lock.yaml" pnpm-lock.yaml
          cp "$STAGED_ROOT/CHANGELOG.md" CHANGELOG.md
          cp "$STAGED_ROOT/public/manifest.json" public/manifest.json
          cp "$STAGED_ROOT/download/bookmark-x.zip" download/bookmark-x.zip
          git diff --exit-code "$SOURCE_SHA" -- . \
            ':(exclude)CHANGELOG.md' \
            ':(exclude)package.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)public/manifest.json' \
            ':(exclude)download/bookmark-x.zip'

          git add \
            CHANGELOG.md \
            package.json \
            pnpm-lock.yaml \
            public/manifest.json \
            download/bookmark-x.zip
          git commit --allow-empty -m "chore(staging): prepare ${{ needs.validate.outputs.tag }}"
          gh auth setup-git
          git push origin HEAD:"refs/heads/staging"

          download_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/staging/download/bookmark-x.zip"
          {
            echo "## Staging is ready"
            echo
            echo "Validated source: \`$SOURCE_SHA\`"
            echo "Version: \`${{ needs.validate.outputs.version }}\`"
            echo
            echo "[Download the tested ZIP]($download_url)"
          } >> "$GITHUB_STEP_SUMMARY"

  wrong-branch:
    name: Require develop for staging
    if: github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Select the develop branch when staging a candidate."
          exit 1
